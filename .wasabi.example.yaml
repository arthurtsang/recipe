# Wasabi configuration is read from environment variables (see backend/setup-env.sh).
# Copy those vars into backend/.env or your Vercel project settings.
#
# Required:
#   WASABI_ACCESS_KEY_ID
#   WASABI_SECRET_ACCESS_KEY
#   WASABI_BUCKET
#   WASABI_REGION          (default: us-east-1)
#
# Optional:
#   WASABI_KEY_PREFIX      (default: recipes)
#   WASABI_ENDPOINT
#   WASABI_PUBLIC_URL_BASE
#   WASABI_BACKUP_KEY_PREFIX (default: db-backups)
#   WASABI_PRESIGN_EXPIRES_SEC (default: 3600)
#   WASABI_DISABLE=1       to disable Wasabi
